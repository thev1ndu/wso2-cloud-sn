name: ServiceNow Comment → GitHub

on:
  repository_dispatch:
    types: [servicenow-note]

permissions:
  issues: write
  contents: read

jobs:
  post-comment:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v8
        env:
          SERVICENOW_UI_URL: ${{ secrets.SERVICENOW_UI_URL }}
        with:
          script: |
            const p = context.payload.client_payload || {};
            const issueNumber = parseInt(p.issue_number, 10);
            const noteText = (p.note_text || '').replace(/\[\/?\s*code\s*\]/gi, '').trim();
            const caseNumber = p.case_number || '';
            const caseSysId = p.case_sys_id || '';
            if (!issueNumber || !noteText) {
              core.warning('Missing issue_number or note_text — skipping');
              return;
            }
            if (/\(GitHub Comment\)/.test(noteText)) {
              core.info('Note originated from GitHub — skipping to prevent echo loop');
              return;
            }
            if (/\(GitHub Actions\)/.test(noteText)) {
              core.info('Note written by GitHub Actions integration — skipping');
              return;
            }
            if (/\bwas updated from\b.+\bto\b/i.test(noteText)) {
              core.info('System field-change entry — skipping');
              return;
            }
            // Deduplication: skip if an identical note was already posted
            const fingerprint = `<!-- sn-note-fp: ${Buffer.from(noteText.slice(0, 120)).toString('base64').slice(0, 40)} -->`;
            const { data: existingComments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: issueNumber
            });
            if (existingComments.some(c => c.user.type === 'Bot' && c.body.includes(fingerprint))) {
              core.info('Duplicate SN note already posted — skipping');
              return;
            }

            const snUiUrl = process.env.SERVICENOW_UI_URL || '';
            const caseUrl = caseSysId && snUiUrl
              ? `${snUiUrl}/now/cwf/agent/record/sn_customerservice_case/${caseSysId}`
              : '';
            const caseLink = caseNumber
              ? (caseUrl ? `[#${caseNumber}](${caseUrl})` : `#${caseNumber}`)
              : '';
            // Mirror just the case link + the note body — no label/meta/footer tags.
            // The first line of the SN note is its metadata header, so drop it.
            const newlineIndex = noteText.indexOf('\n');
            const rawBody  = newlineIndex !== -1 ? noteText.slice(newlineIndex + 1) : noteText;
            const bodyText = rawBody
              .replace(/<br\s*\/?>/gi, '\n')
              .replace(/<\/p>/gi, '\n')
              .replace(/<img[^>]*?\ssrc=["']([^"']+)["'][^>]*>/gi, '$1')
              .replace(/<[^>]+>/g, '')
              .replace(/\n{3,}/g, '\n\n')
              .trim() || noteText.trim();
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: issueNumber,
              body: `${caseLink ? caseLink + '\n\n' : ''}${bodyText}\n\n${fingerprint}`
            });
