name: Issue · Retry Case Creation

on:
  issue_comment:
    types: [created]

permissions:
  issues: write
  contents: read
  actions: write

concurrency:
  group: issue_retry-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  retry:
    runs-on: ubuntu-latest
    if: |
      github.event.comment.user.type != 'Bot' &&
      contains(github.event.comment.body, '/retry')
    timeout-minutes: 5
    steps:
      - id: check
        uses: actions/github-script@v8
        with:
          script: |
            const issueNumber = context.payload.issue.number;
            const commenter   = context.payload.comment.user.login;

            const allowedRoles = ['OWNER', 'MEMBER', 'COLLABORATOR'];
            if (!allowedRoles.includes(context.payload.comment.author_association)) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: issueNumber,
                body: `\u{26A0}\u{FE0F} **Retry skipped** — only repository collaborators can trigger \`/retry\`.\n\n---\n*Triggered by @${commenter}*`
              });
              core.setOutput('should_retry', 'false');
              return;
            }

            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: issueNumber
            });

            if (!issue.labels.some(l => l.name === 'validation-passed')) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: issueNumber,
                body: `\u{26A0}\u{FE0F} **Retry skipped** — issue #${issueNumber} has not passed validation yet.\n\nMake sure all required fields are filled in and the \`validation-passed\` label is present before retrying.\n\n---\n*Triggered by @${commenter}*`
              });
              core.setOutput('should_retry', 'false');
              return;
            }

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: issueNumber
            });

            if (comments.some(c => c.user.type === 'Bot' && c.body.includes('ServiceNow Case Created'))) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: issueNumber,
                body: `\u{2139}\u{FE0F} **Retry skipped** — a ServiceNow case already exists for issue #${issueNumber}.\n\n---\n*Triggered by @${commenter}*`
              });
              core.setOutput('should_retry', 'false');
              return;
            }

            // Change requests ([CR]: title) route to the single "Generic Requests"
            // catalog; everything else uses the generic service-request catalog.
            const catalogItem  = issue.title.startsWith('[CR]:') ? 'Generic Requests' : 'General Requests';

            // Keyed off the label each template applies automatically (see
            // .github/ISSUE_TEMPLATE/*.yml), not a marker string in the body.
            const labelNames = issue.labels.map(l => l.name);
            const isIncident = labelNames.includes('Type/Incident');
            const crMap = {
              'CR/NormalChange':    'Normal Change',
              'CR/StandardChange':  'Standard Change',
              'CR/EmergencyChange': 'Emergency Change'
            };
            const crLabel   = labelNames.find(l => crMap[l]);

            const caseType  = isIncident ? 'Incident' : 'Service Request';
            const srType    = crLabel ? crMap[crLabel] : '';

            core.setOutput('should_retry',  'true');
            core.setOutput('catalog_item',  catalogItem);
            core.setOutput('case_type',     caseType);
            core.setOutput('sr_type',       srType);

      - id: trigger
        if: steps.check.outputs.should_retry == 'true'
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issueNumber = String(context.payload.issue.number);
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              workflow_id: 'servicenow_create_case.yml',
              ref: context.ref || 'main',
              inputs: {
                issue_number: issueNumber,
                catalog_item: '${{ steps.check.outputs.catalog_item }}',
                case_type:    '${{ steps.check.outputs.case_type }}',
                sr_type:      '${{ steps.check.outputs.sr_type }}'
              }
            });
            const commenter = context.payload.comment.user.login;
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: parseInt(issueNumber),
              body: `\u{D83D}\u{DD01} **Case creation re-triggered** for issue #${issueNumber}.\n\nA new workflow run has been dispatched. You will see a confirmation comment once the case is created in ServiceNow.\n\n---\n*Triggered by @${commenter} via \`/retry\`*`
            });
